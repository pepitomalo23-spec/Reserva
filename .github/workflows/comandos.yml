name: Leer comandos de Telegram

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Leer y procesar comandos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python leer_comandos.py

      - name: Guardar cambios de configuración si los hay
        run: |
          git config user.name "reserva-bot"
          git config user.email "actions@github.com"
          git add config.json telegram_offset.txt
          git diff --cached --quiet || git commit -m "Actualizar configuración desde Telegram"
          git pull --rebase
          git push
