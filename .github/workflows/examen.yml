name: Generar examen

# Lo lanza el botón de examen.html (a través de api/examen.js), pero también
# se puede lanzar a mano: Actions -> Generar examen -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      temas:
        description: "Temas separados por ; (id o parte del nombre, p.ej. '1/2004; Constitución'). 'todos' = todos"
        required: true
        default: "todos"
      num_preguntas:
        description: "Número de preguntas"
        required: false
        default: "30"
      usar_tutorbomberos:
        description: "Sacar también preguntas de Tutorbomberos"
        type: boolean
        default: true
      modo:
        description: "examen = normal · reconocimiento = solo mandar capturas de Tutorbomberos para ajustar el robot"
        type: choice
        options: [examen, reconocimiento]
        default: examen

permissions:
  contents: read

concurrency:
  group: examen
  cancel-in-progress: false

jobs:
  examen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests reportlab

      - name: Instalar navegador (solo si hace falta Tutorbomberos)
        if: ${{ inputs.usar_tutorbomberos || inputs.modo == 'reconocimiento' }}
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Generar y enviar examen
        env:
          TEMAS: ${{ inputs.temas }}
          NUM_PREGUNTAS: ${{ inputs.num_preguntas }}
          USAR_TUTORBOMBEROS: ${{ inputs.usar_tutorbomberos }}
          MODO: ${{ inputs.modo }}
          TUTORBOMBEROS_USER: ${{ secrets.TUTORBOMBEROS_USER }}
          TUTORBOMBEROS_PASS: ${{ secrets.TUTORBOMBEROS_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generar_examen.py
