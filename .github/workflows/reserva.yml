name: Reserva automática de piscina

on:
  schedule:
    # 21:45 UTC todos los días -> comprueba si el día de dentro de 2 días
    # está activado en config.json, y si es así, lo reserva.
    - cron: "45 21 * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde GitHub para probar

jobs:
  reservar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Ejecutar reserva
        env:
          IMDECO_USER: ${{ secrets.IMDECO_USER }}
          IMDECO_PASS: ${{ secrets.IMDECO_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OMITIR_ESPERA: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python reservar_piscina.py

      - name: Guardar capturas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-error
          path: "*.png"
