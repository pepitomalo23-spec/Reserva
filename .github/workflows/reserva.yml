name: Reserva automática de piscina

on:
  schedule:
    # El cron de GitHub Actions NO es puntual: en la práctica las ejecuciones
    # programadas llegan con 30-120 minutos de retraso y muchas se pierden
    # (con el antiguo "*/5 21-23" casi nunca caía en los primeros minutos
    # tras la medianoche y por eso no se reservaba nada).
    #
    # Por eso ahora se lanzan pasadas desde la tarde (18:00 UTC = 19:00/20:00
    # en Madrid) hasta la madrugada. La primera que arranca antes de la
    # medianoche de Madrid deja el navegador listo y ESPERA hasta las
    # 00:00:00 para reservar en el instante en que se abre el hueco. Si
    # ninguna llega a tiempo, la primera de la madrugada reserva igualmente.
    # El resto de pasadas de esa noche ven que ya se intentó y no hacen nada.
    - cron: "*/15 18-23 * * *"
    - cron: "*/15 0-3 * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde GitHub para probar

# Solo una reserva automática a la vez: si una está esperando a medianoche,
# las siguientes pasadas se quedan en cola y, al arrancar, ven la marca de
# "ya intentada" y terminan sin hacer nada.
concurrency:
  group: reserva-automatica
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reservar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Decidir si toca reservar
        id: plan
        env:
          EVENTO: ${{ github.event_name }}
        run: python3 reservar_piscina.py --plan

      - name: Comprobar si esta reserva ya se intentó
        id: marca
        if: steps.plan.outputs.ejecutar == 'true' && github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: marca-reserva
          key: reserva-${{ steps.plan.outputs.fecha }}
          lookup-only: true

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.ejecutar == 'true' && steps.marca.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: steps.plan.outputs.ejecutar == 'true' && steps.marca.outputs.cache-hit != 'true'
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Ejecutar reserva ${{ steps.plan.outputs.fecha }}
        id: reserva
        if: steps.plan.outputs.ejecutar == 'true' && steps.marca.outputs.cache-hit != 'true'
        env:
          IMDECO_USER: ${{ secrets.IMDECO_USER }}
          IMDECO_PASS: ${{ secrets.IMDECO_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          FECHA_OBJETIVO: ${{ steps.plan.outputs.fecha }}
          ESPERAR_APERTURA: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python reservar_piscina.py

      - name: Marcar esta reserva como ya intentada
        if: always() && steps.reserva.outputs.resultado == 'intentada' && github.event_name == 'schedule'
        run: mkdir -p marca-reserva && date -u > marca-reserva/hecha.txt

      - name: Guardar la marca
        if: always() && steps.reserva.outputs.resultado == 'intentada' && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: marca-reserva
          key: reserva-${{ steps.plan.outputs.fecha }}

      - name: Guardar capturas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-error
          path: |
            *.png
            *.html
